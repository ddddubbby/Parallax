name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # D-092 e2e hotfix: a real Postgres service for the Playwright smoke run,
    # so its DB never depends on embedded-Postgres initdb succeeding on the
    # runner (which failed after `playwright install --with-deps` mutated the
    # system). `pnpm test` keeps its own embedded-Postgres (unaffected).
    # Host port 5544 avoids colliding with vitest's embedded DB on :5433.
    services:
      e2e-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parallax_e2e
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
          DISABLE_AUTH: "true"
          APP_ENV: development
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5544/parallax_e2e
